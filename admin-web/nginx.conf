server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — same purpose as public/_redirects (Netlify) and
  # vercel.json's rewrites (Vercel): any route not matching a real static
  # file falls back to index.html so react-router's client-side routing
  # handles it, instead of nginx 404ing a hard refresh on a sub-route.
  location / {
    try_files $uri /index.html;
  }
}
