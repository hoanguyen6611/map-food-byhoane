# Deploy from the REPO ROOT: `fly deploy --config admin-web/fly.toml`
# See docs/deploy-flyio.md for the full runbook and required --build-arg flags.
#
# `dockerfile` below is relative to THIS file's own directory (admin-web/),
# not to the build context — Fly resolves it that way regardless of Working
# Directory/--config, so it must stay a bare filename, not "admin-web/Dockerfile"
# (that doubles into admin-web/admin-web/Dockerfile and fails to build). The
# actual build context (where the Dockerfile's COPY paths run from) is still
# the repo root, set by leaving "Working directory" empty in the dashboard.

app = "foodmap-admin"        # must be globally unique on Fly — change if taken
primary_region = "sin"       # Singapore — closest Fly region to Vietnam

[build]
  dockerfile = "Dockerfile"

  # Fly's GitHub-integration dashboard deploy has no field to pass
  # --build-arg — [build.args] works for both the CLI and dashboard. Not a
  # secret (it's just the public backend domain), safe to commit. Update
  # this if the Railway backend domain ever changes.
  [build.args]
    VITE_API_URL = "https://foodmapbyhoa.up.railway.app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
