# Deploy from the REPO ROOT: `fly deploy --config admin-web/fly.toml --dockerfile admin-web/Dockerfile`
# See docs/deploy-flyio.md for the full runbook and required --build-arg flags.

app = "foodmap-admin"        # must be globally unique on Fly — change if taken
primary_region = "sin"       # Singapore — closest Fly region to Vietnam

[build]
  dockerfile = "admin-web/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
