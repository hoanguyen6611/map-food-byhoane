services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: foodmap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodmap
      POSTGRES_PASSWORD: foodmap
      POSTGRES_DB: foodmap
    ports:
      - '5432:5432'
    volumes:
      - foodmap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foodmap']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: foodmap-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  foodmap-postgres-data:
