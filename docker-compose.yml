services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: foodmap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodmap
      POSTGRES_PASSWORD: foodmap
      POSTGRES_DB: foodmap
    ports:
      # Loopback-only, not '5432:5432' — reachable at localhost:5432 for
      # local dev exactly as before, but never from a VM's public
      # interface in production (docs/deploy-oracle-cloud.md). Compose
      # override files do NOT replace list-type keys like `ports` across
      # -f files (they merge/append instead, confirmed via `docker compose
      # config`), so this can't be flipped per-environment via an override
      # — binding to loopback in the base file is what actually works in
      # both environments with zero duplication.
      - '127.0.0.1:5432:5432'
    volumes:
      - foodmap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foodmap']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: foodmap-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379' # loopback-only — see postgres's port comment above
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for Module 7's real media upload pipeline
  # (backend/src/modules/media). Local-dev-only stand-in for a real bucket —
  # no cloud credentials exist in this sandbox, and MinIO speaks the same
  # S3 API as production S3/R2 would, so @aws-sdk/client-s3 code paths are
  # identical either way (see S3_ENDPOINT/S3_FORCE_PATH_STYLE in backend/env.example).
  minio:
    image: minio/minio:latest
    container_name: foodmap-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: foodmap
      MINIO_ROOT_PASSWORD: foodmap12345
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000' # S3 API — deliberately public (see docs/deploy-oracle-cloud.md):
      # mobile clients PUT/GET directly against presigned URLs, so this
      # must be reachable from outside in production, not just by the
      # backend container.
      - '127.0.0.1:9001:9001' # web console — admin-only, loopback-only (see postgres's port comment above)
    volumes:
      - foodmap-minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot init: creates the bucket and makes it public-read so the
  # backend can hand out plain https URLs for the display/thumbnail images
  # without a CDN in front. Public-read is a local-dev-only shortcut —
  # production would front a private bucket with a CDN/signed GETs instead.
  minio-init:
    image: minio/mc:latest
    container_name: foodmap-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 foodmap foodmap12345 &&
      mc mb --ignore-existing local/foodmap-media &&
      mc anonymous set download local/foodmap-media
      "

volumes:
  foodmap-postgres-data:
  foodmap-minio-data:
